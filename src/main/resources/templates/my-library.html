<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Biblioteczka - BookNook</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">

    <style>
        /* --- STYLE SPECYFICZNE DLA BIBLIOTECZKI --- */

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; margin-top: 80px; }

        /* Styl Półek */
        .shelf-container { margin-bottom: 50px; }
        .shelf-title {
            color: white;
            margin: 20px 0;
            padding-bottom: 10px;
            font-size: 22px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.2);
        }

        .shelf-paper {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            min-height: 200px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* Siatka i Karty */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            text-align: center;
            border: 1px solid #eee;
            position: relative;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .book-title {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .book-author {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Menu Akcji (Kebab Menu na kartach) */
        .card-actions {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
        }

        .btn-actions {
            background: rgba(255, 255, 255, 0.9);
            border: none;
            font-size: 22px;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: 0.2s;
        }

        .action-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 40px;
            background: white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            border-radius: 10px;
            width: 180px;
            padding: 8px 0;
            text-align: left;
            z-index: 100;
        }
        .action-menu.show { display: block; }

        .menu-label {
            font-size: 10px;
            color: #aaa;
            padding: 5px 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .menu-opt {
            width: 100%;
            padding: 10px 15px;
            border: none;
            background: none;
            text-align: left;
            font-size: 13px;
            color: #444;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .menu-opt:hover { background: #f0f2ff; color: #667eea; }
        .opt-remove { color: #ff4b2b; }

        hr { border: 0; border-top: 1px solid #eee; margin: 8px 0; }
        .empty-msg { color: #999; text-align: center; margin-top: 50px; font-style: italic; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-left">
        <a href="/home" class="btn-back">← Powrót </a>
    </div>
    <div class="nav-center"><h1>BookNook</h1></div>
    <div class="nav-right" id="userMenuTrigger">
        <span class="user-greeting" th:text="'Witaj, ' + ${username}">Witaj!</span>
        <div class="avatar">👤</div>
        <div class="dropdown-menu" id="dropdownMenu">
            <a href="#" class="dropdown-item">Statystyki</a>
            <a href="#" class="dropdown-item">Ustawienia profilu</a>
            <a href="#" class="dropdown-item">Znajomi</a>

            <form th:action="@{/logout}" method="post">
                <button type="submit" class="dropdown-item logout-btn">Wyloguj się</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">

    <div class="shelf-container">
        <h2 class="shelf-title">📖 Teraz czytam</h2>
        <div class="shelf-paper">
            <div class="grid">
                <div th:each="userBook : ${userBooks}" th:if="${userBook.status == 'READING'}" class="card">
                    <div class="card-actions">
                        <button class="btn-actions" onclick="toggleActionMenu(this)">⋮</button>
                        <div class="action-menu">
                            <p class="menu-label">Zmień status na:</p>
                            <form th:action="@{/library/update-status}" method="post">
                                <input type="hidden" name="userBookId" th:value="${userBook.id}">
                                <button type="submit" name="newStatus" value="TO_READ" class="menu-opt">⏳ Chcę przeczytać</button>
                                <button type="submit" name="newStatus" value="COMPLETED" class="menu-opt">✅ Przeczytane</button>
                            </form>
                            <hr>
                            <form th:action="@{/library/remove}" method="post">
                                <input type="hidden" name="userBookId" th:value="${userBook.id}">
                                <button type="submit" class="menu-opt opt-remove" onclick="return confirm('Usunąć tę książkę z biblioteki?')">🗑️ Usuń książkę</button>
                            </form>
                        </div>
                    </div>

                    <img th:src="${userBook.book.coverUrl != null ? userBook.book.coverUrl : 'https://via.placeholder.com/180x250?text=Brak+Okładki'}" alt="Okładka">
                    <div class="book-title" th:title="${userBook.book.title}" th:text="${userBook.book.title}">Tytuł</div>
                    <div class="book-author" th:text="${userBook.book.authors}">Autor</div>
                </div>
            </div>
            <p th:if="${#lists.isEmpty(userBooks.?[status == 'READING'])}" class="empty-msg">Brak książek w tej sekcji.</p>
        </div>
    </div>

    <div class="shelf-container">
        <h2 class="shelf-title">⏳ Chcę przeczytać</h2>
        <div class="shelf-paper">
            <div class="grid">
                <div th:each="userBook : ${userBooks}" th:if="${userBook.status == 'TO_READ'}" class="card">
                    <div class="card-actions">
                        <button class="btn-actions" onclick="toggleActionMenu(this)">⋮</button>
                        <div class="action-menu">
                            <p class="menu-label">Zmień status na:</p>
                            <form th:action="@{/library/update-status}" method="post">
                                <input type="hidden" name="userBookId" th:value="${userBook.id}">
                                <button type="submit" name="newStatus" value="READING" class="menu-opt">📖 Teraz czytam</button>
                                <button type="submit" name="newStatus" value="COMPLETED" class="menu-opt">✅ Przeczytane</button>
                            </form>
                            <hr>
                            <form th:action="@{/library/remove}" method="post">
                                <input type="hidden" name="userBookId" th:value="${userBook.id}">
                                <button type="submit" class="menu-opt opt-remove" onclick="return confirm('Usunąć tę książkę z biblioteki?')">🗑️ Usuń książkę</button>
                            </form>
                        </div>
                    </div>
                    <img th:src="${userBook.book.coverUrl != null ? userBook.book.coverUrl : 'https://via.placeholder.com/180x250?text=Brak+Okładki'}" alt="Okładka">
                    <div class="book-title" th:title="${userBook.book.title}" th:text="${userBook.book.title}">Tytuł</div>
                    <div class="book-author" th:text="${userBook.book.authors}">Autor</div>
                </div>
            </div>
            <p th:if="${#lists.isEmpty(userBooks.?[status == 'TO_READ'])}" class="empty-msg">Brak książek w tej sekcji.</p>
        </div>
    </div>

    <div class="shelf-container">
        <h2 class="shelf-title">✅ Przeczytane</h2>
        <div class="shelf-paper">
            <div class="grid">
                <div th:each="userBook : ${userBooks}" th:if="${userBook.status == 'COMPLETED'}" class="card">
                    <div class="card-actions">
                        <button class="btn-actions" onclick="toggleActionMenu(this)">⋮</button>
                        <div class="action-menu">
                            <p class="menu-label">Zmień status na:</p>
                            <form th:action="@{/library/update-status}" method="post">
                                <input type="hidden" name="userBookId" th:value="${userBook.id}">
                                <button type="submit" name="newStatus" value="READING" class="menu-opt">📖 Teraz czytam</button>
                                <button type="submit" name="newStatus" value="TO_READ" class="menu-opt">⏳ Chcę przeczytać</button>
                            </form>
                            <hr>
                            <form th:action="@{/library/remove}" method="post">
                                <input type="hidden" name="userBookId" th:value="${userBook.id}">
                                <button type="submit" class="menu-opt opt-remove" onclick="return confirm('Usunąć tę książkę z biblioteki?')">🗑️ Usuń książkę</button>
                            </form>
                        </div>
                    </div>
                    <img th:src="${userBook.book.coverUrl != null ? userBook.book.coverUrl : 'https://via.placeholder.com/180x250?text=Brak+Okładki'}" alt="Okładka">
                    <div class="book-title" th:title="${userBook.book.title}" th:text="${userBook.book.title}">Tytuł</div>
                    <div class="book-author" th:text="${userBook.book.authors}">Autor</div>
                </div>
            </div>
            <p th:if="${#lists.isEmpty(userBooks.?[status == 'COMPLETED'])}" class="empty-msg">Brak książek w tej sekcji.</p>
        </div>
    </div>

</div>

<script>
    // Menu profilu (Navbar)
    const trigger = document.getElementById('userMenuTrigger');
    const menu = document.getElementById('dropdownMenu');
    trigger.addEventListener('click', function(e) {
        e.stopPropagation();
        menu.classList.toggle('active');
    });

    // Menu akcji książki (Trzy kropki)
    function toggleActionMenu(btn) {
        // Zamyka inne otwarte menu akcji
        document.querySelectorAll('.action-menu').forEach(m => {
            if (m !== btn.nextElementSibling) m.classList.remove('show');
        });
        // Przełącza obecne
        btn.nextElementSibling.classList.toggle('show');
    }

    // Zamknij wszystkie menu po kliknięciu poza nimi
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.card-actions')) {
            document.querySelectorAll('.action-menu').forEach(m => m.classList.remove('show'));
        }
        if (!e.target.closest('#userMenuTrigger')) {
            menu.classList.remove('active');
        }
    });
</script>

</body>
</html>
