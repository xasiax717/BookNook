<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${user.username} + ' - Biblioteczka'"></title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed; min-height: 100vh; color: #333;
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 50px 20px; }
        .header { text-align: center; color: white; margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .status-badge {
            display: inline-block; margin-top: 10px; padding: 4px 10px;
            background: #f0f2ff; color: #764ba2; border-radius: 20px; font-size: 11px; font-weight: 600;
        }
        .results-header { color: white; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div style="font-size: 50px;">👤</div>
        <h1 th:text="${user.username}">Nazwa</h1>
        <p>Profil czytelnika</p>
    </div>

    <h2 class="results-header">Książki na półce</h2>
    <div class="grid">
        <div th:each="ub : ${books}" class="card">
            <div style="font-size: 30px;">📖</div>
            <h3 th:text="${ub.book.title}" style="font-size: 16px; margin: 10px 0 5px;">Tytuł</h3>
            <p th:text="${ub.book.authors}" style="font-size: 14px; color: #666; margin: 0;">Autor</p>
            <span class="status-badge" th:text="${ub.status}">Status</span>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(books)}" style="text-align: center; color: white; margin-top: 40px;">
        <p>Ta biblioteczka jest jeszcze pusta.</p>
    </div>
</div>
</body>
</html>
