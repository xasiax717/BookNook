<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - BookNook</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<div style="max-width: 400px; margin: 100px auto; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
    <h2 style="color: #333; margin-bottom: 20px;">Forgot Password</h2>

    <div th:if="${message}" style="color: #2ecc71; margin-bottom: 15px;" th:text="${message}"></div>
    <div th:if="${error}" style="color: #ff4b2b; margin-bottom: 15px;" th:text="${error}"></div>

    <form th:action="@{/forgot-password}" method="post">
        <div style="margin-bottom: 20px;">
            <label style="display:block; margin-bottom: 5px; font-weight: bold;">Email address</label>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="email" name="email" required
                   style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 5px; font-size: 16px;">
        </div>
        <button type="submit"
                style="width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea, #764ba2);
                       color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold;">
            Send reset link
        </button>
    </form>
    <div style="text-align: center; margin-top: 20px;">
        <a href="/login" style="color: #667eea; text-decoration: none;">Back to login</a>
    </div>
</div>
</body>
</html>
