<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - BookNook</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">

    <style>
        .main-content {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin-top: 70px;
        }

        .search-container {
            background: white;
            padding: 50px 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 650px;
            text-align: center;
        }

        .search-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        .search-bar {
            width: 100%;
            padding: 15px 25px;
            border: 2px solid #ddd;
            border-radius: 50px;
            font-size: 16px;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .search-bar:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.2);
        }

        .btn-search {
            padding: 12px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            min-width: 150px;
        }

        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.3);
        }

        .home-header h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .home-header p {
            color: #777;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-left">
        <a th:href="@{/library/my-library}" class="btn-library">Your Library</a>
    </div>

    <div class="nav-center">
        <h1>BookNook</h1>
    </div>

    <div class="nav-right" id="userMenuTrigger">
        <span class="user-greeting" th:text="'Hello, ' + ${username}">Hello, User</span>
        <div class="avatar">👤</div>

        <div class="dropdown-menu" id="dropdownMenu">
            <a href="/statistics" class="dropdown-item">Statistics</a>
            <a href="#" class="dropdown-item">Profile Settings</a>
            <a href="/friends" class="dropdown-item">Friends</a>
            <a href="/recommendations" class="dropdown-item">Recommendations</a>

            <form th:action="@{/logout}" method="post">
                <button type="submit" class="dropdown-item logout-btn">Log out</button>
            </form>
        </div>
    </div>
</nav>

<div class="main-content">
    <div class="search-container">
        <div class="home-header">
            <h1>Find your next book</h1>
            <p>Search our database and add books onto your shelves</p>
        </div>

        <form th:action="@{/search}" method="get" class="search-form">
            <div class="search-input-wrapper" style="width: 100%;">
                <input type="text" name="query" class="search-bar"
                       placeholder="Enter title, author or ISBN..." required>
            </div>
            <button type="submit" class="btn-search">Search</button>
        </form>
    </div>
</div>

<script>
    const trigger = document.getElementById('userMenuTrigger');
    const menu = document.getElementById('dropdownMenu');

    trigger.addEventListener('click', function(e) {
        e.stopPropagation();
        menu.classList.toggle('active');
    });

    document.addEventListener('click', function() {
        if (menu.classList.contains('active')) {
            menu.classList.remove('active');
        }
    });
</script>
</body>
</html>
