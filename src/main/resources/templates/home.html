<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNook - Strona główna</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .home-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center; /* Centrowanie tekstu wewnątrz ramki */
        }

        .home-header {
            margin-bottom: 30px;
        }

        .home-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .home-header p {
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
        }

        /* Styl przycisku dopasowany do btn-register */
        .btn-logout {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }

        .btn-logout:hover {
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .home-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
<div class="home-container">
    <div class="home-header">
        <h1>Witaj w BookNook!</h1>
        <p>Zalogowałeś się pomyślnie do systemu.</p>
    </div>

    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn-logout">Wyloguj się</button>
    </form>
</div>
</body>
</html>
