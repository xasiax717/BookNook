<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - BookNook</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">

    <style>
        .container {
            max-width: 1S0px;
            margin: 0 auto;
            padding: 20px;
            margin-top: 80px;
        }

        .results-header {
            color: white;
            margin-bottom: 30px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.2);
        }

        /* Results Grid */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }

        /* Book Card */
        .book-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .book-card:hover { transform: translateY(-5px); }

        .book-cover-wrapper {
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
            overflow: hidden;
        }

        .book-cover {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .book-info {
            flex-grow: 1;
            text-align: center;
        }

        .book-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .book-author {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }

        /* Dropdown Menu on Card */
        .dropdown-add { position: relative; width: 100%; }

        .btn-add-main {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .add-menu-options {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 0;
            width: 100%;
            background: white;
            border-radius: 8px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.2);
            z-index: 10;
            margin-bottom: 5px;
        }

        .add-menu-options.show { display: flex; flex-direction: column; }

        .menu-opt {
            padding: 12px;
            border: none;
            background: none;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
            color: #444;
        }

        .menu-opt:hover { background: #f0f2ff; color: #667eea; }
        .menu-opt:not(:last-child) { border-bottom: 1px solid #eee; }

        .no-results {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="nav-left">
        <a href="/home" style="text-decoration: none; color: #667eea; font-weight: bold;">← Back</a>
    </div>
    <div class="nav-center">
        <h1>BookNook</h1>
    </div>

    <div class="nav-right" id="userMenuTrigger">
        <span class="user-greeting" th:text="'Hello, ' + ${username}">Hello, User</span>
        <div class="avatar">👤</div>

        <div class="dropdown-menu" id="dropdownMenu">
            <a href="#" class="dropdown-item">Statistics</a>
            <a href="#" class="dropdown-item">Profile Settings</a>
            <a href="#" class="dropdown-item">Friends</a>

            <form th:action="@{/logout}" method="post">
                <button type="submit" class="dropdown-item logout-btn">Log out</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="results-header" th:text="'Results for: ' + ${query}">Search Results</h2>

    <div class="results-grid" th:if="${not #lists.isEmpty(books)}">
        <div th:each="book : ${books}" class="book-card"
             th:onclick="|window.location.href='@{/library/book-details(id=${book.externalId}, coverUrl=${book.coverUrl}, title=${book.title}, authors=${book.authors})}'|"
             style="cursor: pointer;">

            <div class="book-cover-wrapper">
                <img class="book-cover"
                     th:src="${book.coverUrl != null ? book.coverUrl : 'https://via.placeholder.com/180x260?text=No+Cover'}"
                     alt="Cover">
            </div>

            <div class="book-info">
                <div class="book-title" th:text="${book.title}">Book Title</div>
                <div class="book-author" th:text="${book.authors}">Author</div>
            </div>

            <div class="add-container" onclick="event.stopPropagation();">
                <form th:action="@{/library/add}" method="post" class="add-book-form">
                    <input type="hidden" name="externalId" th:value="${book.externalId}">
                    <input type="hidden" name="title" th:value="${book.title}">
                    <input type="hidden" name="authors" th:value="${book.authors}">
                    <input type="hidden" name="coverUrl" th:value="${book.coverUrl}">
                    <input type="hidden" name="numberOfPages" th:value="${book.numberOfPages}">

                    <div class="dropdown-add">
                        <button type="button" class="btn-add-main" onclick="toggleAddMenu(this)">Add to shelf ▾</button>
                        <div class="add-menu-options">
                            <button type="submit" name="newStatus" value="TO_READ" class="menu-opt">⏳ Want to read</button>
                            <button type="submit" name="newStatus" value="READING" class="menu-opt">📖 Currently reading</button>
                            <button type="submit" name="newStatus" value="COMPLETED" class="menu-opt">✅ Read</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="no-results" th:if="${#lists.isEmpty(books)}">
        <h3>No books found</h3>
        <p>We couldn't find any books matching your search. Try something else!</p>
        <br>
        <a href="/home" style="color: #667eea; font-weight: bold;">Back to search</a>
    </div>
</div>

<script>
    const trigger = document.getElementById('userMenuTrigger');
    const menu = document.getElementById('dropdownMenu');

    trigger.addEventListener('click', function(e) {
        e.stopPropagation();
        menu.classList.toggle('active');
    });

    function toggleAddMenu(btn) {
        event.stopPropagation();

        const currentMenu = btn.nextElementSibling;
        const isOpen = currentMenu.classList.contains('show');

        document.querySelectorAll('.add-menu-options').forEach(m => {
            m.classList.remove('show');
        });

        if (!isOpen) {
            currentMenu.classList.add('show');
        }
    }

    window.onclick = function(event) {
        if (!event.target.closest('#userMenuTrigger')) {
            if (menu.classList.contains('active')) {
                menu.classList.remove('active');
            }
        }

        if (!event.target.matches('.btn-add-main')) {
            document.querySelectorAll('.add-menu-options').forEach(m => {
                m.classList.remove('show');
            });
        }
    };
</script>
</body>
</html>
