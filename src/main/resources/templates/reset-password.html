<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - BookNook</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<div style="max-width: 400px; margin: 100px auto; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
    <h2 style="color: #333; margin-bottom: 20px;">Reset Password</h2>

    <form th:action="@{/reset-password}" method="post">
        <input type="hidden" name="token" th:value="${token}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div style="margin-bottom: 20px;">
            <label style="display:block; margin-bottom: 5px; font-weight: bold;">New password</label>
            <input type="password" name="password" id="newPassword" required
                   style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 5px; font-size: 16px;">
            <div style="font-size: 12px; color: #666; margin-top: 5px;">
                At least 8 characters, uppercase letter, number, special character
            </div>
        </div>
        <div style="margin-bottom: 20px;">
            <label style="display:block; margin-bottom: 5px; font-weight: bold;">Confirm password</label>
            <input type="password" name="confirmPassword" id="confirmNewPassword" required
                   style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 5px; font-size: 16px;">
            <div id="matchError" style="color: #ff4b2b; font-size: 13px; display: none;">Passwords do not match!</div>
        </div>
        <button type="submit"
                style="width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea, #764ba2);
                       color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold;">
            Reset Password
        </button>
    </form>
</div>
<script>
    const np = document.getElementById('newPassword');
    const cnp = document.getElementById('confirmNewPassword');
    const err = document.getElementById('matchError');
    cnp.addEventListener('input', () => {
        err.style.display = np.value !== cnp.value ? 'block' : 'none';
    });
</script>
</body>
</html>
